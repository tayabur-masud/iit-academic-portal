<main class="auth-page" id="main">
  <section class="auth-card card" aria-labelledby="login-title">
    <app-auth-brand />
    <h1 id="login-title">Sign in</h1>

    @if (errorMessage(); as message) {
      <div class="alert alert-error" role="alert">
        <strong class="alert-title">Sign-in failed</strong>
        <p>{{ message }}</p>
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate [attr.aria-busy]="submitting()">
      <div class="field">
        <label class="field-label" for="email">Email</label>
        <input
          id="email"
          class="field-input"
          type="email"
          formControlName="email"
          autocomplete="username"
          required
          [attr.aria-invalid]="showError('email')"
          [attr.aria-describedby]="showError('email') ? 'email-error' : null"
        />
        @if (showError('email')) {
          <p class="field-error" id="email-error">{{ emailError() }}</p>
        }
      </div>

      <div class="field">
        <label class="field-label" for="password">Password</label>
        <input
          id="password"
          class="field-input"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          required
          [attr.aria-invalid]="showError('password')"
          [attr.aria-describedby]="showError('password') ? 'password-error' : null"
        />
        @if (showError('password')) {
          <p class="field-error" id="password-error">Enter your password.</p>
        }
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="submitting()">
        @if (submitting()) {
          <span class="spinner" aria-hidden="true"></span>
          Signing in…
        } @else {
          Sign in
        }
      </button>
      <p class="sr-only" role="status">{{ submitting() ? 'Signing in…' : '' }}</p>
    </form>

    <p class="auth-footer"><a routerLink="/forgot-password">Forgot your password?</a></p>
  </section>
</main>
